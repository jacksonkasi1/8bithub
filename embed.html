<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-BitHub Embedded</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    
    .game-container {
      position: relative;
      width: 320px;
      height: 240px;
      background-color: #000;
      overflow: hidden;
    }
    
    /* CRT effect */
    .crt-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }
    
    /* Scanlines */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0, 0, 0, 0.3) 51%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 12;
      opacity: 0.5;
    }
    
    /* Game message overlay */
    .game-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      color: #FFFFFF;
      font-family: 'Courier New', monospace;
      text-align: center;
      z-index: 20;
      display: none;
    }
    
    .game-message h2 {
      margin-bottom: 20px;
      text-shadow: 2px 2px 0px #AA0000;
    }
    
    .game-message button {
      background-color: #333;
      color: #FFF;
      border: 2px solid #555;
      padding: 5px 15px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
    }
    
    .game-message button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game-container">
    <div class="crt-effect"></div>
    <div class="scanlines"></div>
    <div class="game-message" id="game-message">
      <h2 id="message-title">GAME OVER</h2>
      <p id="message-text">Your spaceship was destroyed!</p>
      <button id="continue-button">CONTINUE</button>
    </div>
  </div>
  
  <script src="8bithub.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize the RetroEngine
      const gameContainer = document.getElementById('game-container');
      const engine = new RetroEngine(gameContainer);
      const gameMessage = document.getElementById('game-message');
      const messageTitle = document.getElementById('message-title');
      const messageText = document.getElementById('message-text');
      const continueButton = document.getElementById('continue-button');
      
      // Get game type from URL hash or default to arcade
      const hash = window.location.hash.substring(1);
      const gameType = (hash && ['arcade', 'adventure', 'demo'].includes(hash)) ? hash : 'arcade';
      
      // Extend the ArcadeGame class to handle game over and level completion
      const originalArcadeGameUpdate = ArcadeGame.prototype.update;
      ArcadeGame.prototype.update = function() {
        originalArcadeGameUpdate.call(this);
        
        // Check for game over conditions
        if (this.enemies.length === 0) {
          // Level complete
          showMessage('LEVEL COMPLETE', 'Prepare for the next wave!', () => {
            // Reset for next level with more enemies
            this.score += 100; // Bonus for completing level
            this.playerY = 200;
            
            // Create new enemies for next level
            for (let i = 0; i < 12; i++) {
              this.enemies.push({
                x: 30 + i * 22,
                y: 50,
                direction: 1.2, // Slightly faster
                frame: 0
              });
            }
          });
        }
        
        // Check if enemies reached player's level
        const enemyReachedBottom = this.enemies.some(enemy => enemy.y >= 190);
        if (enemyReachedBottom) {
          showMessage('GAME OVER', 'The aliens have invaded!', () => {
            // Reset game
            engine.loadDisk(gameType);
          });
        }
      };
      
      // Extend collision checking
      const originalCheckCollisions = ArcadeGame.prototype.checkCollisions;
      ArcadeGame.prototype.checkCollisions = function() {
        originalCheckCollisions.call(this);
        
        // Check enemy-player collisions
        const collision = this.enemies.some(enemy => 
          Math.abs(this.playerX - enemy.x) < 15 && 
          Math.abs(this.playerY - enemy.y) < 10
        );
        
        if (collision) {
          showMessage('GAME OVER', 'Your spaceship was destroyed!', () => {
            // Reset game
            engine.loadDisk(gameType);
          });
        }
      };
      
      // Function to show game messages
      function showMessage(title, text, callback) {
        engine.running = false;
        messageTitle.textContent = title;
        messageText.textContent = text;
        gameMessage.style.display = 'flex';
        
        continueButton.onclick = function() {
          gameMessage.style.display = 'none';
          engine.running = true;
          if (callback) callback();
        };
      }
      
      // Ensure welcome animation plays fully
      const originalShowLoadingSequence = DiskSystem.prototype.showLoadingSequence;
      DiskSystem.prototype.showLoadingSequence = function(disk) {
        // Ensure the loading sequence gets enough time to complete
        return new Promise(resolve => {
          originalShowLoadingSequence.call(this, disk).then(() => {
            // Add a slight delay to ensure the animation completes
            setTimeout(resolve, 300);
          });
        });
      };
      
      // Load the selected disk
      engine.loadDisk(gameType);
      
      // Handle keyboard for text adventure input focus
      document.addEventListener('keydown', function(e) {
        if (engine.running) {
          if (engine.currentGame instanceof TextAdventure && e.key.length === 1) {
            // Focus game canvas for text input
            gameContainer.focus();
          }
          
          // Add game pause/resume functionality with Escape key
          if (e.key === 'Escape') {
            if (engine.running) {
              showMessage('GAME PAUSED', 'Press CONTINUE to resume', () => {
                // Resume game
              });
            }
          }
        }
      });
      
      // Make sure the game container is focusable for keyboard events
      gameContainer.tabIndex = 1;
      gameContainer.focus();
    });
  </script>
</body>
</html>
