<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-BitHub Embedded</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    
    .game-container {
      position: relative;
      width: 320px;
      height: 240px;
      background-color: #000;
      overflow: hidden;
    }
    
    /* CRT effect */
    .crt-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }
    
    /* Scanlines */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0, 0, 0, 0.3) 51%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 12;
      opacity: 0.5;
    }
    
    /* Game message overlay */
    .game-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      color: #FFFFFF;
      font-family: 'Courier New', monospace;
      text-align: center;
      z-index: 20;
      display: none;
    }
    
    .game-message h2 {
      margin-bottom: 20px;
      text-shadow: 2px 2px 0px #AA0000;
    }
    
    .game-message button {
      background-color: #333;
      color: #FFF;
      border: 2px solid #555;
      padding: 5px 15px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
    }
    
    .game-message button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game-container">
    <div class="crt-effect"></div>
    <div class="scanlines"></div>
    <div class="game-message" id="game-message">
      <h2 id="message-title">GAME OVER</h2>
      <p id="message-text">Your spaceship was destroyed!</p>
      <button id="continue-button">CONTINUE</button>
    </div>
  </div>
  
  <script src="8bithub.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize the RetroEngine
      const gameContainer = document.getElementById('game-container');
      const gameMessage = document.getElementById('game-message');
      const messageTitle = document.getElementById('message-title');
      const messageText = document.getElementById('message-text');
      const continueButton = document.getElementById('continue-button');
      
      // Get game type from URL hash or default to arcade
      const hash = window.location.hash.substring(1);
      const gameType = (hash && ['arcade', 'adventure', 'demo'].includes(hash)) ? hash : 'arcade';
      
      // Create a new engine
      let engine = new RetroEngine(gameContainer);
      
      // Store key event handlers to remove them later
      let keyDownHandler = null;
      let keyUpHandler = null;
      
      // Override RetroEngine's loadDisk to ensure it returns a proper Promise
      const originalLoadDisk = RetroEngine.prototype.loadDisk;
      RetroEngine.prototype.loadDisk = function(diskId) {
        console.log("Loading disk: " + diskId);
        try {
          // Ensure original method is called with proper context
          const result = originalLoadDisk.call(this, diskId);
          
          // If the result is already a Promise, return it
          if (result && typeof result.then === 'function') {
            return result;
          }
          
          // Otherwise, create a new Promise
          return new Promise((resolve, reject) => {
            try {
              // Set a timeout to give the engine time to initialize
              setTimeout(() => {
                if (this.currentGame) {
                  console.log("Game loaded via timeout");
                  resolve();
                } else {
                  console.error("Failed to load game after timeout");
                  reject(new Error("Game load timeout"));
                }
              }, 1000);
            } catch (err) {
              console.error("Error in loadDisk promise:", err);
              reject(err);
            }
          });
        } catch (err) {
          console.error("Error in loadDisk:", err);
          return Promise.reject(err);
        }
      };
      
      // Reset the entire game environment
      function resetGame() {
        console.log("Performing complete game reset");
        
        try {
          // Remove existing event listeners
          if (keyDownHandler) {
            document.removeEventListener('keydown', keyDownHandler);
            keyDownHandler = null;
          }
          if (keyUpHandler) {
            document.removeEventListener('keyup', keyUpHandler);
            keyUpHandler = null;
          }
          
          // Stop the current game loop
          if (engine) {
            engine.running = false;
          }
          
          // Clear the game container
          const elements = gameContainer.querySelectorAll('canvas');
          elements.forEach(element => {
            gameContainer.removeChild(element);
          });
          
          // Create a completely new engine
          engine = new RetroEngine(gameContainer);
          
          // Load the selected disk
          console.log("Loading disk after reset: " + gameType);
          return engine.loadDisk(gameType)
            .then(() => {
              console.log("Disk loaded successfully after reset");
              console.log("New game initialized with " + 
                        (engine.currentGame && engine.currentGame.enemies ? 
                         engine.currentGame.enemies.length : 0) + " enemies");
              
              // Set up global keyboard handlers
              setupGlobalHandlers();
              
              // Make sure game is running
              engine.running = true;
              
              return Promise.resolve();
            })
            .catch(err => {
              console.error("Error loading disk after reset:", err);
              // Try direct approach if the promise-based approach fails
              try {
                engine = new RetroEngine(gameContainer);
                engine.diskSystem.loadDisk(gameType);
                engine.running = true;
                setupGlobalHandlers();
                return Promise.resolve();
              } catch (e) {
                console.error("Fallback loading also failed:", e);
                alert("Failed to restart game. Please refresh the page.");
                return Promise.reject(e);
              }
            });
        } catch (err) {
          console.error("Error in resetGame:", err);
          return Promise.reject(err);
        }
      }
      
      // Function to show game messages with robust reset
      function showMessage(title, text, isGameOver = true) {
        // Stop the game loop
        if (engine) {
          engine.running = false;
        }
        
        // Display the message
        messageTitle.textContent = title;
        messageText.textContent = text;
        gameMessage.style.display = 'flex';
        
        // Set up continue button
        continueButton.onclick = function() {
          // Hide the message
          gameMessage.style.display = 'none';
          
          if (isGameOver) {
            // Perform complete game reset for game over
            resetGame().then(() => {
              console.log("Game reset complete");
            }).catch(err => {
              console.error("Error during game reset:", err);
              // Force page reload if reset fails
              window.location.reload();
            });
          } else {
            // Just resume for pause
            if (engine) {
              engine.running = true;
            }
          }
        };
      }
      
      // Set up global keyboard handlers
      function setupGlobalHandlers() {
        // Handle keyboard for pausing
        keyDownHandler = function(e) {
          if (engine && engine.running) {
            // Pause with Escape key
            if (e.key === 'Escape') {
              showMessage('GAME PAUSED', 'Press CONTINUE to resume', false);
            }
            
            // Handle Text Adventure special case
            if (engine.currentGame instanceof TextAdventure && e.key.length === 1) {
              gameContainer.focus();
            }
          }
        };
        
        document.addEventListener('keydown', keyDownHandler);
      }
      
      // Override ArcadeGame to integrate with our reset system
      const OriginalArcadeGame = ArcadeGame;
      ArcadeGame = function(engine) {
        this.engine = engine;
        this.playerX = 160;
        this.playerY = 200;
        this.bullets = [];
        this.enemies = [];
        this.score = 0;
        this.leftPressed = false;
        this.rightPressed = false;
        
        // Create enemies
        this.createEnemies();
        
        // Set up input handling specific to this game instance
        this.setupInputHandlers();
      };
      
      // Clone prototype methods from original
      ArcadeGame.prototype = Object.create(OriginalArcadeGame.prototype);
      
      // Add method to create enemies
      ArcadeGame.prototype.createEnemies = function() {
        // Clear any existing enemies
        this.enemies = [];
        
        // Create 3 rows of enemies in a grid
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 8; col++) {
            this.enemies.push({
              x: 40 + col * 30,
              y: 40 + row * 20,
              direction: 1,
              frame: 0,
              type: row % 3
            });
          }
        }
        
        console.log(`Created ${this.enemies.length} enemies`);
      };
      
      // Set up input handlers specific to the game
      ArcadeGame.prototype.setupInputHandlers = function() {
        // Remove any existing handlers to prevent duplicates
        if (this._keyDownHandler) {
          document.removeEventListener('keydown', this._keyDownHandler);
        }
        if (this._keyUpHandler) {
          document.removeEventListener('keyup', this._keyUpHandler);
        }
        
        // Create bound handlers
        this._keyDownHandler = (e) => {
          if (e.key === 'ArrowLeft') {
            this.leftPressed = true;
          } else if (e.key === 'ArrowRight') {
            this.rightPressed = true;
          } else if (e.key === ' ' || e.key === 'Space') {
            if (this.bullets.length < 5) {
              this.bullets.push({
                x: this.playerX,
                y: this.playerY - 5
              });
              
              if (this.engine.audioEngine) {
                this.engine.audioEngine.playSound('shoot');
              }
            }
          }
        };
        
        this._keyUpHandler = (e) => {
          if (e.key === 'ArrowLeft') {
            this.leftPressed = false;
          } else if (e.key === 'ArrowRight') {
            this.rightPressed = false;
          }
        };
        
        // Add event listeners
        document.addEventListener('keydown', this._keyDownHandler);
        document.addEventListener('keyup', this._keyUpHandler);
      };
      
      // Update method
      ArcadeGame.prototype.update = function() {
        // Move player
        if (this.leftPressed) this.playerX = Math.max(10, this.playerX - 3);
        if (this.rightPressed) this.playerX = Math.min(310, this.playerX + 3);
        
        // Update bullets
        this.bullets.forEach(bullet => {
          bullet.y -= 5;
        });
        this.bullets = this.bullets.filter(bullet => bullet.y > 0);
        
        // Update enemies
        let changeDirection = false;
        
        // Only proceed with enemy updates if we have enemies
        if (this.enemies.length > 0) {
          this.enemies.forEach(enemy => {
            enemy.x += enemy.direction;
            enemy.frame = (enemy.frame + 1) % 30;
            
            if (enemy.x <= 10 || enemy.x >= 310) {
              changeDirection = true;
            }
          });
          
          if (changeDirection) {
            this.enemies.forEach(enemy => {
              enemy.direction *= -1;
              enemy.y += 10;
            });
          }
          
          // Check for collisions
          this.checkCollisions();
          
          // Check for victory
          if (this.enemies.length === 0) {
            showMessage('LEVEL COMPLETE', 'Prepare for the next wave!');
          }
          
          // Check if enemies reached bottom
          const enemyReachedBottom = this.enemies.some(enemy => enemy.y >= 190);
          if (enemyReachedBottom) {
            showMessage('GAME OVER', 'The aliens have invaded!');
          }
        } else {
          // Safeguard - if no enemies, create them
          this.createEnemies();
        }
      };
      
      // Render method
      ArcadeGame.prototype.render = function(ctx, palette) {
        // Clear the screen
        ctx.fillStyle = palette[0]; // Black background
        ctx.fillRect(0, 0, 320, 240);
        
        // Draw player
        ctx.fillStyle = palette[11]; // Cyan
        ctx.fillRect(this.playerX - 10, this.playerY, 20, 10);
        ctx.fillRect(this.playerX - 5, this.playerY - 5, 10, 5);
        
        // Draw bullets
        ctx.fillStyle = palette[14]; // Yellow
        this.bullets.forEach(bullet => {
          ctx.fillRect(bullet.x - 1, bullet.y, 2, 5);
        });
        
        // Draw enemies - make them more visible with brighter colors
        this.enemies.forEach(enemy => {
          // Different enemy types have different colors
          const enemyColors = [
            [palette[12], palette[13]], // Red/Magenta for type 0
            [palette[10], palette[11]], // Blue/Cyan for type 1
            [palette[14], palette[15]]  // Yellow/White for type 2
          ];
          
          const [color1, color2] = enemyColors[enemy.type % 3];
          ctx.fillStyle = enemy.frame < 15 ? color1 : color2;
          
          // Draw enemy body (larger and more visible)
          ctx.fillRect(enemy.x - 8, enemy.y, 16, 8);
          ctx.fillRect(enemy.x - 10, enemy.y + 2, 20, 4);
          
          // Draw enemy eyes
          ctx.fillStyle = palette[15]; // White
          ctx.fillRect(enemy.x - 5, enemy.y + 2, 2, 2);
          ctx.fillRect(enemy.x + 3, enemy.y + 2, 2, 2);
        });
        
        // Draw score
        ctx.fillStyle = palette[15]; // White
        ctx.font = '8px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${this.score}`, 10, 20);
        
        // Debug info - show enemy count
        ctx.fillText(`ENEMIES: ${this.enemies.length}`, 10, 30);
      };
      
      // Check for collisions
      ArcadeGame.prototype.checkCollisions = function() {
        // Check bullet-enemy collisions
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          
          for (let j = this.enemies.length - 1; j >= 0; j--) {
            const enemy = this.enemies[j];
            
            if (Math.abs(bullet.x - enemy.x) < 10 && Math.abs(bullet.y - enemy.y) < 10) {
              // Remove the enemy
              this.enemies.splice(j, 1);
              
              // Remove the bullet
              this.bullets.splice(i, 1);
              
              // Add score
              this.score += 10;
              
              // Play sound
              if (this.engine.audioEngine) {
                this.engine.audioEngine.playSound('shoot');
              }
              
              // Break to avoid checking this bullet against other enemies
              break;
            }
          }
        }
        
        // Check enemy-player collisions
        for (let i = 0; i < this.enemies.length; i++) {
          const enemy = this.enemies[i];
          
          if (Math.abs(this.playerX - enemy.x) < 15 && Math.abs(this.playerY - enemy.y) < 15) {
            showMessage('GAME OVER', 'Your spaceship was destroyed!');
            break;
          }
        }
      };
      
      // Set up loading animation
      DiskSystem.prototype.showLoadingSequence = function(disk) {
        // Original implementation with a promise wrapper
        const ctx = this.engine.ctx;
        const width = this.engine.canvas.width;
        const height = this.engine.canvas.height;
        
        // Draw disk image
        this.drawDisk(ctx, width/2, height/2 - 40, disk.color, disk.title);
        
        // Loading text
        ctx.fillStyle = this.engine.palette[15];
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LOADING...', width/2, height/2 + 50);
        
        // Progress bar
        const progressWidth = 160;
        const progressHeight = 8;
        const progressX = (width - progressWidth) / 2;
        const progressY = height/2 + 60;
        
        ctx.strokeStyle = this.engine.palette[15];
        ctx.strokeRect(progressX, progressY, progressWidth, progressHeight);
        
        // Simulate loading with proper Promise
        return new Promise(resolve => {
          let progress = 0;
          const interval = setInterval(() => {
            progress += Math.random() * 5;
            if (progress >= 100) {
              clearInterval(interval);
              
              // Loading complete sound
              if (this.engine.audioEngine) {
                try {
                  this.engine.audioEngine.playSound('ready');
                } catch (e) {
                  console.warn("Could not play sound", e);
                }
              }
              
              setTimeout(resolve, 500);
            }
            
            // Update progress bar
            const fillWidth = (progress / 100) * progressWidth;
            ctx.fillStyle = disk.color;
            ctx.fillRect(progressX, progressY, fillWidth, progressHeight);
            
            // Add loading noise
            this.drawLoadingNoise(ctx, width, height);
            
            // Loading bytes text
            ctx.fillStyle = this.engine.palette[15];
            ctx.fillText(`LOADING BYTES: ${Math.floor(progress * 640)}`, width/2, height/2 + 80);
            
          }, 200);
        });
      };
      
      // Initialize game on first load
      setupGlobalHandlers();
      console.log("Initial load of disk: " + gameType);
      
      // Add error handling for initial load
      engine.loadDisk(gameType)
        .then(() => {
          console.log("Initial disk load complete");
          
          // Make sure container is focusable
          gameContainer.tabIndex = 1;
          gameContainer.focus();
        })
        .catch((err) => {
          console.error("Error during initial load:", err);
          alert("Failed to load the game. Please refresh the page.");
        });
    });
  </script>
</body>
</html>
