<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-BitHub Embedded</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    
    .game-container {
      position: relative;
      width: 320px;
      height: 240px;
      background-color: #000;
      overflow: hidden;
    }
    
    /* CRT effect */
    .crt-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }
    
    /* Scanlines */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0, 0, 0, 0.3) 51%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 12;
      opacity: 0.5;
    }
    
    /* Game message overlay */
    .game-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      color: #FFFFFF;
      font-family: 'Courier New', monospace;
      text-align: center;
      z-index: 20;
      display: none;
    }
    
    .game-message h2 {
      margin-bottom: 20px;
      text-shadow: 2px 2px 0px #AA0000;
    }
    
    .game-message button {
      background-color: #333;
      color: #FFF;
      border: 2px solid #555;
      padding: 5px 15px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
    }
    
    .game-message button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game-container">
    <div class="crt-effect"></div>
    <div class="scanlines"></div>
    <div class="game-message" id="game-message">
      <h2 id="message-title">GAME OVER</h2>
      <p id="message-text">Your spaceship was destroyed!</p>
      <button id="continue-button">CONTINUE</button>
    </div>
  </div>
  
  <script src="8bithub.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize the RetroEngine
      const gameContainer = document.getElementById('game-container');
      const engine = new RetroEngine(gameContainer);
      const gameMessage = document.getElementById('game-message');
      const messageTitle = document.getElementById('message-title');
      const messageText = document.getElementById('message-text');
      const continueButton = document.getElementById('continue-button');
      
      // Get game type from URL hash or default to arcade
      const hash = window.location.hash.substring(1);
      const gameType = (hash && ['arcade', 'adventure', 'demo'].includes(hash)) ? hash : 'arcade';
      
      // Fix and override ArcadeGame constructor to ensure enemies are created properly
      const originalArcadeGameConstructor = ArcadeGame.prototype.constructor;
      ArcadeGame = function(engine) {
        this.engine = engine;
        this.playerX = 160;
        this.playerY = 200;
        this.bullets = [];
        this.enemies = [];
        this.score = 0;
        this.leftPressed = false;
        this.rightPressed = false;
        
        // Create initial enemies - ensure they are positioned correctly
        this.createEnemies();
        
        // Set up input handling
        document.addEventListener('keydown', (e) => this.handleInput(e));
        document.addEventListener('keyup', (e) => {
          if (e.key === 'ArrowLeft') {
            this.leftPressed = false;
          } else if (e.key === 'ArrowRight') {
            this.rightPressed = false;
          }
        });
      };
      
      // Add enemy creation method
      ArcadeGame.prototype.createEnemies = function() {
        this.enemies = []; // Clear existing enemies
        
        // Create 3 rows of enemies
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 8; col++) {
            this.enemies.push({
              x: 40 + col * 30,
              y: 40 + row * 20,
              direction: 1,
              frame: 0,
              type: row % 3 // Different enemy types
            });
          }
        }
        
        console.log(`Created ${this.enemies.length} enemies`);
      };
      
      // Override render to make enemies more visible
      ArcadeGame.prototype.render = function(ctx, palette) {
        // Clear the screen
        ctx.fillStyle = palette[0]; // Black background
        ctx.fillRect(0, 0, 320, 240);
        
        // Draw player
        ctx.fillStyle = palette[11]; // Cyan
        ctx.fillRect(this.playerX - 10, this.playerY, 20, 10);
        ctx.fillRect(this.playerX - 5, this.playerY - 5, 10, 5);
        
        // Draw bullets
        ctx.fillStyle = palette[14]; // Yellow
        this.bullets.forEach(bullet => {
          ctx.fillRect(bullet.x - 1, bullet.y, 2, 5);
        });
        
        // Draw enemies - make them more visible with brighter colors
        this.enemies.forEach(enemy => {
          // Different enemy types have different colors
          const enemyColors = [
            [palette[12], palette[13]], // Red/Magenta for type 0
            [palette[10], palette[11]], // Blue/Cyan for type 1
            [palette[14], palette[15]]  // Yellow/White for type 2
          ];
          
          const [color1, color2] = enemyColors[enemy.type % 3];
          ctx.fillStyle = enemy.frame < 15 ? color1 : color2;
          
          // Draw enemy body (larger and more visible)
          ctx.fillRect(enemy.x - 8, enemy.y, 16, 8);
          ctx.fillRect(enemy.x - 10, enemy.y + 2, 20, 4);
          
          // Draw enemy eyes
          ctx.fillStyle = palette[15]; // White
          ctx.fillRect(enemy.x - 5, enemy.y + 2, 2, 2);
          ctx.fillRect(enemy.x + 3, enemy.y + 2, 2, 2);
        });
        
        // Draw score
        ctx.fillStyle = palette[15]; // White
        ctx.font = '8px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${this.score}`, 10, 20);
        
        // Debug info - show enemy count
        ctx.fillText(`ENEMIES: ${this.enemies.length}`, 10, 30);
      };
      
      // Fix update method for better movement
      ArcadeGame.prototype.update = function() {
        // Move player
        if (this.leftPressed) this.playerX = Math.max(10, this.playerX - 3);
        if (this.rightPressed) this.playerX = Math.min(310, this.playerX + 3);
        
        // Update bullets
        this.bullets.forEach(bullet => {
          bullet.y -= 5;
        });
        this.bullets = this.bullets.filter(bullet => bullet.y > 0);
        
        // Update enemies
        let changeDirection = false;
        
        // Only proceed with enemy updates if we have enemies
        if (this.enemies.length > 0) {
          this.enemies.forEach(enemy => {
            enemy.x += enemy.direction;
            enemy.frame = (enemy.frame + 1) % 30;
            
            if (enemy.x <= 10 || enemy.x >= 310) {
              changeDirection = true;
            }
          });
          
          if (changeDirection) {
            this.enemies.forEach(enemy => {
              enemy.direction *= -1;
              enemy.y += 10;
            });
          }
          
          // Check collisions
          this.checkCollisions();
          
          // Check for victory condition
          if (this.enemies.length === 0) {
            showMessage('LEVEL COMPLETE', 'Prepare for the next wave!', () => {
              this.score += 100; // Bonus for completing level
              this.createEnemies(); // Create new enemies for next level
            });
          }
          
          // Check if enemies reached player's level
          const enemyReachedBottom = this.enemies.some(enemy => enemy.y >= 190);
          if (enemyReachedBottom) {
            showMessage('GAME OVER', 'The aliens have invaded!', null);
            return; // Stop further updates to prevent state changes during reset
          }
        } else {
          // If no enemies, create them (safeguard)
          this.createEnemies();
        }
      };
      
      // Fix collision checking
      ArcadeGame.prototype.checkCollisions = function() {
        // Check bullet-enemy collisions
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          
          for (let j = this.enemies.length - 1; j >= 0; j--) {
            const enemy = this.enemies[j];
            
            if (Math.abs(bullet.x - enemy.x) < 10 && Math.abs(bullet.y - enemy.y) < 10) {
              // Remove the enemy
              this.enemies.splice(j, 1);
              
              // Remove the bullet
              this.bullets.splice(i, 1);
              
              // Add score
              this.score += 10;
              
              // Play sound
              if (this.engine.audioEngine) {
                this.engine.audioEngine.playSound('shoot');
              }
              
              // Break to avoid checking this bullet against other enemies
              break;
            }
          }
        }
        
        // Check enemy-player collisions
        for (let i = 0; i < this.enemies.length; i++) {
          const enemy = this.enemies[i];
          
          if (Math.abs(this.playerX - enemy.x) < 15 && Math.abs(this.playerY - enemy.y) < 15) {
            showMessage('GAME OVER', 'Your spaceship was destroyed!', null);
            return; // Stop further updates to prevent state changes during reset
          }
        }
      };
      
      // Fix input handling
      ArcadeGame.prototype.handleInput = function(e) {
        if (e.key === 'ArrowLeft') {
          this.leftPressed = true;
        } else if (e.key === 'ArrowRight') {
          this.rightPressed = true;
        } else if (e.key === ' ' || e.key === 'Space') {
          // Limit the number of bullets to prevent spam
          if (this.bullets.length < 5) {
            this.bullets.push({
              x: this.playerX,
              y: this.playerY - 5
            });
            
            // Play shoot sound
            if (this.engine.audioEngine) {
              this.engine.audioEngine.playSound('shoot');
            }
          }
        }
      };
      
      // Function to show game messages
      function showMessage(title, text, callback) {
        engine.running = false;
        messageTitle.textContent = title;
        messageText.textContent = text;
        gameMessage.style.display = 'flex';
        
        continueButton.onclick = function() {
          gameMessage.style.display = 'none';
          
          // Complete restart of the game to ensure clean state
          if (title === 'GAME OVER') {
            // For a complete reset, reload the disk instead of just creating new enemies
            engine.loadDisk(gameType).then(() => {
              console.log("Game completely restarted after game over");
              engine.running = true;
            });
          } else {
            // For level complete or pause, just resume
            engine.running = true;
            if (callback) callback();
          }
        };
      }
      
      // Ensure welcome animation plays fully
      const originalShowLoadingSequence = DiskSystem.prototype.showLoadingSequence;
      DiskSystem.prototype.showLoadingSequence = function(disk) {
        // Ensure the loading sequence gets enough time to complete
        return new Promise(resolve => {
          originalShowLoadingSequence.call(this, disk).then(() => {
            // Add a slight delay to ensure the animation completes
            setTimeout(resolve, 500);
          });
        });
      };
      
      // Enhance the game loading process to ensure proper restart
      const originalLoadDisk = engine.loadDisk;
      engine.loadDisk = function(diskId) {
        // Reset any lingering game state first
        if (engine.currentGame) {
          if (engine.currentGame instanceof ArcadeGame) {
            engine.currentGame.leftPressed = false;
            engine.currentGame.rightPressed = false;
            engine.currentGame.bullets = [];
            engine.currentGame.enemies = [];
            engine.currentGame.score = 0;
          }
        }
        
        // Call the original loadDisk method
        return originalLoadDisk.call(this, diskId);
      };
      
      // Load the selected disk with debug
      console.log(`Loading disk: ${gameType}`);
      engine.loadDisk(gameType).then(() => {
        console.log(`Disk loaded: ${gameType}`);
        console.log(`Game initialized: ${engine.currentGame ? 'Yes' : 'No'}`);
        if (engine.currentGame && engine.currentGame instanceof ArcadeGame) {
          console.log(`Enemies: ${engine.currentGame.enemies.length}`);
        }
      });
      
      // Handle keyboard for text adventure input focus
      document.addEventListener('keydown', function(e) {
        if (engine.running) {
          if (engine.currentGame instanceof TextAdventure && e.key.length === 1) {
            // Focus game canvas for text input
            gameContainer.focus();
          }
          
          // Add game pause/resume functionality with Escape key
          if (e.key === 'Escape') {
            if (engine.running) {
              showMessage('GAME PAUSED', 'Press CONTINUE to resume', () => {
                // Resume game
              });
            }
          }
        }
      });
      
      // Make sure the game container is focusable for keyboard events
      gameContainer.tabIndex = 1;
      gameContainer.focus();
    });
  </script>
</body>
</html>
